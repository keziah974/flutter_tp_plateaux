name: mini_games_app
description: Application multi-jeux en Flutter (Clean Architecture / BLoC / Firebase).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.1

  # State Management & Navigation
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  go_router: ^14.8.0

  # Local Storage & UI Helpers
  shared_preferences: ^2.3.5
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/audio/